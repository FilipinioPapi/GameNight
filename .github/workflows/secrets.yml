# Checks every push and pull request for anything sensitive (keys, tokens, passwords, personal emails,
# home-network addresses). Uses only the repo's own script, nothing downloaded. Rules: docs/SECURITY_RULES.md
name: Secret check

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The scan's own tests
        run: python3 -m unittest tools/security/test_scan_secrets.py
      - name: Every file as it is now
        run: python3 tools/security/scan_secrets.py
      - name: This pull request's commits (names, emails, messages)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/security/scan_secrets.py --commits "$BASE..HEAD"
