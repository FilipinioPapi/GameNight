[package]
name = "game-night"
version = "0.3.5"
description = "Game Night: play Jayden's retro game library with friends"
edition = "2021"
publish = false

[lib]
name = "game_night_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
dirs = "6"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
getrandom = "0.3"
base64 = "0.22"
sha2 = "0.10"
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
# Couch Play's relay bridge (tauri already brings tokio; these are the parts it uses).
tokio = { version = "1", features = ["net", "time", "io-util", "macros", "sync", "rt"] }

[features]
# Only for CI's Windows update test: lets a test server and test key stand in. Never in shipped builds.
e2e = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }
gilrs = "0.11"
# Reads which controllers are plugged in (as the game player sees them) and whether Steam is open,
# and keeps the Couch Play game window over its box (gamebox.rs).
windows = { version = "0.61", features = ["Win32_Devices_HumanInterfaceDevice", "Win32_UI_Input", "Win32_UI_Input_XboxController", "Win32_System_LibraryLoader", "Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
