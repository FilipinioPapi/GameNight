[package]
name = "game-night"
version = "0.1.0"
description = "Game Night: play Jayden's retro game library with friends"
edition = "2021"
publish = false

[lib]
name = "game_night_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
