# Builds the Game Night Windows app on every push and pull request.
# The installer is attached to the run as "Game-Night-windows" so it can be downloaded and tried.
# (Not code-signed yet: that's milestone 6, so Windows will show a "Windows protected your PC" warning.)
name: Windows app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["app/**", "tools/player/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "tools/player/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Install Linux build libraries (for the Rust tests)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo test
        working-directory: app/src-tauri

  windows:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - name: Fetch the game player (RetroArch, checked against fixed fingerprints)
        run: python ../tools/player/fetch_player.py src-tauri/player
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Game-Night-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # Merging a pull request that raises the version number (app/src-tauri/tauri.conf.json) makes a GitHub
  # release. Jayden's NAS picks it up (tools/unraid/gamenight_sync.sh), signs it and offers it to every
  # Game Night app. Same version as an existing release: nothing happens.
  release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Game-Night-windows
          path: dist
      - name: Release this version if it's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          setup=$(ls dist/*-setup.exe | head -1)
          cp "$setup" GameNightSetup.exe
          gh release create "v$version" GameNightSetup.exe --title "Game Night $version" --notes-file app/UPDATE_NOTES.txt --target "$GITHUB_SHA"
