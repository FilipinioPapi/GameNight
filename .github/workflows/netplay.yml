# Online co-op test: two copies of Game Night's pinned RetroArch play together on GitHub's Windows machine,
# each with its own pretend Xbox pad, and tools/e2e/netplay_test.py measures whether they connect, stay in sync,
# and put each pad on the right player. Nothing here touches Game Night's app or releases.
# Rounds: straight on this machine and with pretend internet delay (every push), and through libretro's public
# relay servers over the real internet (New York, Madrid, Sao Paulo, Singapore; only when started by hand, and
# reported without failing the job). Only the relay rounds go to the internet: libretro's lobby (to find the
# relay; one round lists a test game publicly the way stock RetroArch does) and the relays themselves.
name: Online co-op test

on:
  push:
    branches: ["claude/**"]
    paths: ["tools/e2e/netplay_test.py", "tools/e2e/make_netplay_rom.py", "tools/e2e/check_netplay_rom.py",
            "tools/e2e/add_pretend_pads.ps1", "tools/player/**", ".github/workflows/netplay.yml"]
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long each round presses random buttons (seconds)"
        default: "90"
      rounds:
        description: "Only these rounds (space separated, e.g. relay-private-nyc), or all"
        default: "all"

permissions:
  contents: read

concurrency:
  group: netplay-${{ github.ref }}-${{ github.event_name }}  # a hand-started relay run and a push run don't cancel each other
  cancel-in-progress: true

jobs:
  netplay:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check the test cartridge's code on a 6502 simulator first
        shell: pwsh
        run: |
          pip install py65==1.2.0
          python tools/e2e/check_netplay_rom.py
      - name: Add two pretend Xbox controllers (ViGEmBus)
        shell: pwsh
        run: tools/e2e/add_pretend_pads.ps1
      - name: Fetch the game player (RetroArch, checked against fixed fingerprints)
        shell: pwsh
        run: python tools/player/fetch_player.py "$env:RUNNER_TEMP/player"
      - name: Two players (same machine, pretend delay, libretro's public relays)
        shell: pwsh
        env:
          NETPLAY_MASH_SECONDS: ${{ github.event.inputs.seconds || '90' }}
          # A push (including a merge that brings these files into another branch) runs only the rounds on this
          # machine. The internet relay rounds run when started by hand (Actions > Online co-op test > Run
          # workflow; "rounds" = all or a list), and their problems are reported as warnings, not failures.
          NETPLAY_ROUNDS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rounds || (github.event_name == 'workflow_dispatch' && 'all' || 'direct delayed') }}
        run: python tools/e2e/netplay_test.py "$env:RUNNER_TEMP/player" "$env:RUNNER_TEMP/netplay" "$env:RUNNER_TEMP/netplay-results"
      - name: Keep the results (logs, numbers, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netplay-results
          path: ${{ runner.temp }}/netplay-results
          if-no-files-found: ignore
          retention-days: 30
