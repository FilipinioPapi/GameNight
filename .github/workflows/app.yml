# Builds the Game Night Windows app on every push and pull request.
# The installer is attached to the run as "Game-Night-windows" so it can be downloaded and tried.
# (Not code-signed yet: that's milestone 6, so Windows will show a "Windows protected your PC" warning.)
name: Windows app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["app/**", "tools/player/**", "tools/e2e/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "tools/player/**", "tools/e2e/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: node scripts/check-version.mjs
      - run: npm run check
      - run: npm run build
      - name: Install Linux build libraries (for the Rust tests)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo test
        working-directory: app/src-tauri

  windows:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - name: Fetch the game player (RetroArch, checked against fixed fingerprints)
        run: python ../tools/player/fetch_player.py src-tauri/player
      - run: npx tauri build
      - name: Keep the new installer aside
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "GN_VERSION=$v" | Out-File $env:GITHUB_ENV -Append
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*_${v}_*-setup.exe).FullName "$env:RUNNER_TEMP/new-setup.exe"
      # A test-only build (version 0.0.1, never released) that CI can drive by itself, to test updating and playing.
      - name: Build the old test version
        shell: pwsh
        run: |
          '{"version":"0.0.1"}' | Out-File -Encoding ascii "$env:RUNNER_TEMP/e2e.conf.json"
          npx tauri build --features e2e --config "$env:RUNNER_TEMP/e2e.conf.json"
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*_0.0.1_*-setup.exe).FullName "$env:RUNNER_TEMP/old-setup.exe"
          Remove-Item src-tauri/target/release/bundle/nsis/*_0.0.1_*-setup.exe
      - name: Test on Windows (install, play a game, update, reopen)
        shell: pwsh
        run: ../tools/e2e/windows_test.ps1 -OldSetup "$env:RUNNER_TEMP/old-setup.exe" -NewSetup "$env:RUNNER_TEMP/new-setup.exe" -NewVersion $env:GN_VERSION -Tools (Resolve-Path ../tools/e2e)
      - name: Keep the update test's screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-screens
          path: ${{ runner.temp }}/update-screens/*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Game-Night-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # Merging a pull request that raises the version number (app/src-tauri/tauri.conf.json) makes a GitHub
  # release. Jayden's NAS picks it up (tools/unraid/gamenight_sync.sh), signs it and offers it to every
  # Game Night app. Same version as an existing release: nothing happens.
  release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Game-Night-windows
          path: dist
      - name: Release this version if it's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          setup=$(ls dist/*-setup.exe | head -1)
          tail -n +2 app/UPDATE_NOTES.txt > notes.txt  # line 1 is "# <version>", for the version check
          cp "$setup" GameNightSetup.exe
          gh release create "v$version" GameNightSetup.exe --title "Game Night $version" --notes-file notes.txt --target "$GITHUB_SHA"
