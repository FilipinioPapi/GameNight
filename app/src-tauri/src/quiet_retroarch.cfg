# RetroArch's own pop-up messages, all off, so a game starts cleanly (Jayden, 2026-10-31).
# Game Night adds these to the settings it writes for every game (games.rs), and the Windows test
# (tools/e2e/popup_test.py) reads this same file, so the test always checks what ships.
# Checked against RetroArch 1.22.2's own code (configuration.c, retroarch.c, runloop.c, video_driver.c):
# "video_font_enable" is RetroArch's main "on-screen messages" switch. Off, it draws no messages at all:
# no "loading", "controller connected", "netplay: X joined", save, fast forward or speed messages.
# (The FPS counter needs it, so games.rs turns it back on only when Show FPS is on in Settings; the
# lines below then still hide every message type RetroArch lets us hide.)
# Game Night's own messages (the game box errors, "connection lost" and so on) are drawn by Game Night,
# not RetroArch, so they are not affected.
video_font_enable = "false"
menu_show_load_content_animation = "false"
notification_show_autoconfig = "false"
notification_show_autoconfig_fails = "false"
notification_show_cheats_applied = "false"
notification_show_patch_applied = "false"
notification_show_remap_load = "false"
notification_show_config_override_load = "false"
notification_show_set_initial_disk = "false"
notification_show_disk_control = "false"
notification_show_save_state = "false"
notification_show_fast_forward = "false"
notification_show_screenshot = "false"
notification_show_refresh_rate = "false"
notification_show_netplay_extra = "false"
